seed: 42
n_jobs: 1

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  processed_dir: data/processed
  split_indices: data/processed/split_indices.npz
  figures_dir: reports/figures
  tables_dir: reports/tables
  logs_dir: reports/logs
  mlflow_db: reports/mlflow.db
  mlflow_artifacts: reports/runs
  optuna_db: reports/optuna.db

data:
  target: Churn
  id_column: customerID
  test_size: 0.2
  stratify: true

cv:
  n_splits: 5
  n_repeats: 5
  inner_valid_size: 0.2

tuning:
  n_trials: 100
  smoke_trials: 5
  logreg_trials: 20
  # Потоки для xgb/lgbm/catboost во время тюнинга. null = половина os.cpu_count().
  n_jobs: null
  # Терпение early stopping внутри trial (обучение на inner-train, контроль по inner-val).
  es_rounds: 50
  sampler: tpe
  pruner: median
  metric: roc_auc
  mlflow_experiment: churn-boosting-benchmark

models:
  - xgboost
  - lightgbm
  - catboost
