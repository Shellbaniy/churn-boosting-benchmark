# Пространства поиска Optuna (этап 5). Ключи моделей совпадают с src/pipelines.py::MODEL_NAMES.
# Схема описания распределения: type (int|float|categorical), low/high/step/choices,
# log: true — лог-шкала (learning_rate и регуляризация ищутся в лог-шкале).
# Секция variant_b добавляет параметры, которые есть только у нативного варианта B.

xgb:
  n_estimators:
    type: int
    low: 200
    high: 2000
    step: 100
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  max_depth:
    type: int
    low: 1
    high: 6
  min_child_weight:
    type: float
    low: 0.01
    high: 20.0
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.4
    high: 1.0
  reg_alpha:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true
  reg_lambda:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true
  gamma:
    type: float
    low: 1.0e-8
    high: 5.0
    log: true

lgbm:
  n_estimators:
    type: int
    low: 200
    high: 2000
    step: 100
  learning_rate:
    type: float
    low: 0.003
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 2
    high: 64
  min_child_samples:
    type: int
    low: 5
    high: 100
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.4
    high: 1.0
  reg_alpha:
    type: float
    low: 1.0e-8
    high: 100.0
    log: true
  reg_lambda:
    type: float
    low: 1.0e-8
    high: 100.0
    log: true

# iterations до 1000: обучение останавливается early stopping по inner-val.
catboost:
  iterations:
    type: int
    low: 200
    high: 1000
    step: 100
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  depth:
    type: int
    low: 2
    high: 8
  l2_leaf_reg:
    type: float
    low: 1.0
    high: 100.0
    log: true
  random_strength:
    type: float
    low: 1.0e-3
    high: 30.0
    log: true
  bagging_temperature:
    type: float
    low: 0.0
    high: 5.0

# Небольшой поиск для честного сравнения с бустингами (по умолчанию 20 trials).
logreg:
  C:
    type: float
    low: 1.0e-3
    high: 1.0e3
    log: true

variant_b:
  catboost:
    max_ctr_complexity:
      type: int
      low: 1
      high: 2

