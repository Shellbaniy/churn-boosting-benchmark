# Пространства поиска Optuna. Распределение log=True для learning_rate и регуляризации.
# Заполняется на этапе 5 (tune). Здесь фиксируется схема, чтобы она была воспроизводимой.

xgboost:
  n_estimators:
    type: int
    low: 200
    high: 2000
    step: 100
  learning_rate:
    type: float
    low: 0.005
    high: 0.3
    log: true
  max_depth:
    type: int
    low: 2
    high: 10
  min_child_weight:
    type: float
    low: 0.1
    high: 20.0
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.4
    high: 1.0
  reg_alpha:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true
  reg_lambda:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true
  gamma:
    type: float
    low: 1.0e-8
    high: 5.0
    log: true

lightgbm:
  n_estimators:
    type: int
    low: 200
    high: 2000
    step: 100
  learning_rate:
    type: float
    low: 0.005
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 8
    high: 128
  min_child_samples:
    type: int
    low: 5
    high: 100
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.4
    high: 1.0
  reg_alpha:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true
  reg_lambda:
    type: float
    low: 1.0e-8
    high: 10.0
    log: true

catboost:
  iterations:
    type: int
    low: 200
    high: 2000
    step: 100
  learning_rate:
    type: float
    low: 0.005
    high: 0.3
    log: true
  depth:
    type: int
    low: 3
    high: 10
  l2_leaf_reg:
    type: float
    low: 1.0e-3
    high: 30.0
    log: true
  random_strength:
    type: float
    low: 1.0e-3
    high: 10.0
    log: true
  bagging_temperature:
    type: float
    low: 0.0
    high: 2.0
